add_treatment:
  name: Add treatment
  description: Record a chemical treatment applied to the pool.
  fields:
    device_id:
      name: Pool device
      description: The pool to apply the treatment to.
      required: true
      selector:
        device:
          integration: poolman
    product:
      name: Product
      description: The chemical product used for treatment.
      required: true
      selector:
        select:
          translation_key: chemical_product
          options:
            - "ph_minus"
            - "ph_plus"
            - "chlore_choc"
            - "galet_chlore"
            - "neutralizer"
            - "tac_plus"
            - "salt"
            - "bromine_tablet"
            - "bromine_shock"
            - "active_oxygen_tablet"
            - "active_oxygen_activator"
            - "flocculant"
            - "anti_algae"
            - "stabilizer"
            - "clarifier"
            - "metal_sequestrant"
            - "calcium_hardness_increaser"
            - "winterizing_product"
    quantity_g:
      name: Quantity
      description: Amount of product used in grams.
      selector:
        number:
          min: 0
          step: 1
          unit_of_measurement: g
          mode: box
    spoons:
      name: Spoons
      description: Number of measuring spoons used. Requires spoon_name to be set.
      selector:
        number:
          min: 0
          step: 0.5
          mode: box
    spoon_name:
      name: Spoon name
      description: Name of the configured measuring spoon to use.
      selector:
        text:
    notes:
      name: Notes
      description: Optional notes about the treatment.
      selector:
        text:

record_measure:
  name: Record measure
  description: Record a manual water chemistry measurement.
  fields:
    device_id:
      name: Pool device
      description: The pool to record the measurement for.
      required: true
      selector:
        device:
          integration: poolman
    parameter:
      name: Parameter
      description: The water parameter being measured.
      required: true
      selector:
        select:
          translation_key: measure_parameter
          options:
            - "ph"
            - "orp"
            - "tds"
            - "tac"
            - "cya"
            - "hardness"
            - "temperature"
    value:
      name: Value
      description: The measured value.
      required: true
      selector:
        number:
          mode: box
    notes:
      name: Notes
      description: Optional notes about the measurement.
      selector:
        text:

boost_filtration:
  name: Boost filtration
  description: Activate a manual filtration boost for extra continuous pump time.
  fields:
    device_id:
      name: Pool device
      description: The pool to boost filtration for.
      required: true
      selector:
        device:
          integration: poolman
    hours:
      name: Duration (hours)
      description: Number of extra filtration hours to add. Set to 0 to cancel an active boost.
      required: true
      selector:
        number:
          min: 0
          max: 48
          step: 0.5
          unit_of_measurement: h
          mode: box

confirm_activation_step:
  name: Confirm activation step
  description: Confirm completion of an activation wizard step.
  fields:
    device_id:
      name: Pool device
      description: The pool to confirm the activation step for.
      required: true
      selector:
        device:
          integration: poolman
    step:
      name: Step
      description: The activation step to confirm as completed.
      required: true
      selector:
        select:
          translation_key: activation_step
          options:
            - "remove_cover"
            - "raise_water_level"
            - "clean_pool_and_filter"
            - "shock_treatment"
            - "intensive_filtration"

inventory_add_product:
  name: Add inventory product
  description: Register a product in the pool's inventory catalog.
  fields:
    entry_id:
      name: Config entry
      description: The Pool Manager config entry that owns the inventory.
      required: true
      selector:
        config_entry:
          integration: poolman
    product_id:
      name: Product ID
      description: Stable identifier used to reference this product.
      required: true
      selector:
        text:
    name:
      name: Display name
      description: Human-readable label for the product.
      required: true
      selector:
        text:
    unit:
      name: Unit
      description: Unit used to express the product quantity.
      required: true
      selector:
        select:
          options:
            - "g"
            - "kg"
            - "mL"
            - "L"
            - "tablet"
    chemical:
      name: Chemical kind
      description: Optional tag mapping this product to a known chemical kind.
      selector:
        select:
          translation_key: chemical_product
          options:
            - "ph_minus"
            - "ph_plus"
            - "chlore_choc"
            - "galet_chlore"
            - "neutralizer"
            - "tac_plus"
            - "salt"
            - "bromine_tablet"
            - "bromine_shock"
            - "active_oxygen_tablet"
            - "active_oxygen_activator"
            - "flocculant"
            - "anti_algae"
            - "stabilizer"
            - "clarifier"
            - "metal_sequestrant"
            - "calcium_hardness_increaser"
            - "winterizing_product"
    initial_quantity:
      name: Initial quantity
      description: Optional initial stock to seed the product with.
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    low_stock_threshold:
      name: Low-stock threshold
      description: Optional threshold; the low-stock binary sensor turns on when quantity falls at or below this value.
      selector:
        number:
          min: 0
          step: 0.1
          mode: box

inventory_remove_product:
  name: Remove inventory product
  description: Remove a product (and its stock) from the inventory catalog.
  fields:
    entry_id:
      name: Config entry
      description: The Pool Manager config entry that owns the inventory.
      required: true
      selector:
        config_entry:
          integration: poolman
    product_id:
      name: Product ID
      description: Identifier of the product to remove.
      required: true
      selector:
        text:

inventory_add_stock:
  name: Add inventory stock
  description: Add stock to an existing inventory product.
  fields:
    entry_id:
      name: Config entry
      description: The Pool Manager config entry that owns the inventory.
      required: true
      selector:
        config_entry:
          integration: poolman
    product_id:
      name: Product ID
      description: Identifier of the product to credit.
      required: true
      selector:
        text:
    quantity:
      name: Quantity
      description: Amount to add, in the product's unit.
      required: true
      selector:
        number:
          min: 0
          step: 0.1
          mode: box

inventory_set_stock:
  name: Set inventory stock
  description: Set the absolute stock (and optionally the low-stock threshold) of a product.
  fields:
    entry_id:
      name: Config entry
      description: The Pool Manager config entry that owns the inventory.
      required: true
      selector:
        config_entry:
          integration: poolman
    product_id:
      name: Product ID
      description: Identifier of the product to update.
      required: true
      selector:
        text:
    quantity:
      name: Quantity
      description: New absolute quantity, in the product's unit.
      required: true
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    low_stock_threshold:
      name: Low-stock threshold
      description: Optional new threshold value.
      selector:
        number:
          min: 0
          step: 0.1
          mode: box

apply_recommendation:
  name: Apply recommendation
  description: Apply a recommendation, creating an Action and updating inventory.
  fields:
    device_id:
      name: Pool device
      description: The Pool Manager device that owns the recommendation.
      required: true
      selector:
        device:
          integration: poolman
    recommendation_id:
      name: Recommendation ID
      description: Identifier of the recommendation to apply (e.g. ``rec_ph_too_high``).
      required: true
      selector:
        text:

record_action:
  name: Record action
  description: Manually record a pool action (treatment, cleaning, maintenance).
  fields:
    device_id:
      name: Pool device
      description: The Pool Manager device the action applies to.
      required: true
      selector:
        device:
          integration: poolman
    type:
      name: Action type
      description: Category of action performed.
      required: true
      selector:
        select:
          translation_key: action_type
          options:
            - "chemical"
            - "cleaning"
            - "maintenance"
    product_id:
      name: Product ID
      description: Identifier of the inventory product consumed by this action.
      selector:
        text:
    quantity:
      name: Quantity
      description: Amount applied (required when product_id is set).
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    unit:
      name: Unit
      description: Unit for the quantity (required when product_id is set, e.g. ``g``, ``mL``, ``tablet``, ``min``).
      selector:
        text:
    note:
      name: Note
      description: Optional free-form note describing the action.
      selector:
        text:

analyze:
  name: Analyze pool
  description: Trigger an immediate pool analysis, refreshing problems and recommendations.
  fields:
    device_id:
      name: Pool device
      description: The Pool Manager device to analyze.
      required: true
      selector:
        device:
          integration: poolman
